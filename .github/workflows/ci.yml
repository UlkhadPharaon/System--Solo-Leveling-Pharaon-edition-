name: CI

# Quality gate on every push/PR to master: typecheck + production build +
# bundle-size guard. The responsive audit needs a live server + Chrome and
# runs only on manual dispatch (workflow_dispatch) to keep CI fast.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Production build
        run: npm run build

      # Fail the build if the main JS chunk regrows past the post-code-split
      # baseline (494 kB raw / ~144 kB gzip). Prevents "someone imports
      # recharts at module top level again" regressions.
      - name: Bundle-size guard
        run: |
          LIMIT_KB=520
          MAIN=$(ls dist/assets/index-*.js | head -1)
          SIZE_KB=$(( $(stat -c%s "$MAIN") / 1024 ))
          echo "main chunk: ${SIZE_KB} kB (limit ${LIMIT_KB} kB)"
          if [ "$SIZE_KB" -gt "$LIMIT_KB" ]; then
            echo "::error::Main bundle grew to ${SIZE_KB} kB (limit ${LIMIT_KB}). Check for new static imports of heavy deps."
            exit 1
          fi

      # Production server actually boots + serves (AGENTS.md pre-push step 4).
      - name: Smoke test production bundle
        run: |
          NODE_ENV=production PORT=3999 node dist/server.cjs &
          SERVER_PID=$!
          sleep 4
          HEALTH=$(curl -s http://localhost:3999/api/health)
          echo "health: $HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"'
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3999/)
          echo "home: $CODE"
          [ "$CODE" = "200" ]
          kill $SERVER_PID
